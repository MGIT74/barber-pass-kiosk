name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install required Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare high contrast Barber One launcher icon
        run: |
          python -m pip install --quiet Pillow
          mkdir -p app/src/main/res/drawable-nodpi
          base64 -d branding/barber_logo.png.base64 > /tmp/barber_source.png
          python - <<'PY'
          from PIL import Image, ImageEnhance, ImageFilter
          src=Image.open('/tmp/barber_source.png').convert('RGBA')
          # The small tagline becomes unreadable on a launcher: use only the main brand mark.
          # The source has transparent background; explicitly make the icon black and white.
          alpha=src.getchannel('A')
          bbox=alpha.getbbox()
          if bbox:
              src=src.crop(bbox)
          w,h=src.size
          src=src.crop((0,0,w,int(h*0.91)))
          bg=Image.new('RGBA',src.size,(0,0,0,255))
          bg.alpha_composite(src)
          icon=Image.new('RGB',(512,512),(0,0,0))
          fitted=bg.convert('RGB')
          # Upscale the cropped logo instead of thumbnail() (which never enlarges).
          scale=min(440/fitted.width,440/fitted.height)
          fitted=fitted.resize((round(fitted.width*scale),round(fitted.height*scale)),Image.Resampling.LANCZOS)
          icon.paste(fitted,((512-fitted.width)//2,(512-fitted.height)//2))
          icon.save('app/src/main/res/drawable-nodpi/barber_logo.png',optimize=True)
          PY
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BarberPassKiosk-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
