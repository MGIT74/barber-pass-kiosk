name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install required Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Generate sharp Barber One launcher icon
        run: |
          python -m pip install --quiet Pillow
          mkdir -p app/src/main/res/drawable-nodpi
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          S=1024
          im=Image.new('RGB',(S,S),'black')
          draw=ImageDraw.Draw(im)
          bold='/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          regular='/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'
          def centered(text,top,max_width,font_path,initial_size):
              size=initial_size
              while True:
                  font=ImageFont.truetype(font_path,size)
                  box=draw.textbbox((0,0),text,font=font,stroke_width=0)
                  if box[2]-box[0]<=max_width:break
                  size-=2
              width=box[2]-box[0]
              draw.text(((S-width)//2-box[0],top-box[1]),text,font=font,fill='white')
          centered('THE',132,850,bold,248)
          centered('BARBER',405,865,regular,152)
          centered('ONE',595,870,bold,245)
          draw.rectangle((190,880,834,892),fill='white')
          im.resize((512,512),Image.Resampling.LANCZOS).save('app/src/main/res/drawable-nodpi/barber_logo.png',optimize=True)
          PY
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BarberPassKiosk-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
